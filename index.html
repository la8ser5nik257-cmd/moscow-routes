<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Москва — маршруты</title>
  <style>
    :root { font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    * { box-sizing: border-box; }
    body { margin:0; background:#f4f4f4; color:#111; }
    header { padding:12px 14px; background:#fff; position:sticky; top:0; z-index:10; box-shadow:0 1px 6px #0002; }
    h1 { margin:0 0 8px; font-size:18px; }
    .controls,.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    button,input,select,textarea {
      font:inherit; border:1px solid #ccc; border-radius:10px; padding:10px 12px; background:#fff;
    }
    button { cursor:pointer; font-weight:600; }
    button.primary { background:#111; color:#fff; border-color:#111; }
    main { padding:10px; }
    .card { background:#fff; border-radius:14px; padding:12px; margin-bottom:10px; box-shadow:0 1px 6px #0001; }
    label { display:block; font-weight:600; margin-bottom:6px; }
    input[type="password"], textarea { width:100%; }
    textarea { min-height:170px; resize:vertical; }
    #map { width:100%; height:60vh; min-height:430px; border-radius:14px; overflow:hidden; background:#ddd; }
    #status { font-size:14px; line-height:1.5; white-space:pre-line; }
    .small { font-size:13px; color:#555; }
  </style>
</head>
<body>
<header>
  <h1>Москва: маршрут на Яндекс Карте</h1>
  <div class="controls">
    <select id="mode" aria-label="Тип маршрута">
      <option value="foot-walking">Пешком</option>
      <option value="cycling-regular">Велосипед</option>
    </select>
    <button class="primary" id="buildBtn">Построить маршрут</button>
  </div>
</header>

<main>
  <section class="card">
    <label for="yandexKey">Ключ Yandex JavaScript API — только карта</label>
    <div class="row">
      <input id="yandexKey" type="password" placeholder="Yandex API key" autocomplete="off" style="flex:1;min-width:220px">
      <button id="saveYandexBtn">Сохранить</button>
    </div>
  </section>

  <section class="card">
    <label for="orsKey">Ключ HeiGIT / openrouteservice — геокодирование и маршрут</label>
    <div class="row">
      <input id="orsKey" type="password" placeholder="HeiGIT API key" autocomplete="off" style="flex:1;min-width:220px">
      <button id="saveOrsBtn">Сохранить</button>
    </div>
    <div class="small">Оба ключа сохраняются только в localStorage браузера на этом устройстве и не записаны в код сайта.</div>
  </section>

  <section class="card">
    <label for="points">Точки маршрута — по одной в строке</label>
    <textarea id="points"></textarea>
    <div class="small">Можно вводить адреса или координаты в формате 55.7558,37.6176.</div>
  </section>

  <section class="card">
    <div id="status">Сохраните два ключа и нажмите «Построить маршрут».</div>
  </section>

  <div id="map"></div>
</main>

<script>
const DEFAULT_POINTS = [
  'Москва, метро Красные Ворота',
  'Москва, Садовая-Спасская улица, 11/1',
  'Москва, Милютинский переулок, 12А',
  'Москва, Кривоколенный переулок, 4, стр. 1',
  'Москва, Архангельский переулок, 15А',
  'Москва, Колпачный переулок, 10/7, стр. 4',
  'Москва, Малый Ивановский переулок, 2, стр. 33',
  'Москва, Хитровская площадь',
  'Москва, Яузская улица, 11/6',
  'Москва, метро Таганская'
];

const $ = id => document.getElementById(id);
let map = null;
let routeLine = null;
let pointCollection = null;
let apiReady = false;

$('points').value = DEFAULT_POINTS.join('\n');

function status(msg) { $('status').textContent = msg; }
function getPoints() { return $('points').value.split('\n').map(x => x.trim()).filter(Boolean); }

function saveKey(field, storageName, label) {
  const key = $(field).value.trim();
  if (!key) return status('Сначала вставьте ' + label + '.');
  localStorage.setItem(storageName, key);
  status(label + ' сохранён на этом устройстве.');
}

$('saveYandexBtn').onclick = () => saveKey('yandexKey','yandex_js_api_key','Yandex API key');
$('saveOrsBtn').onclick = () => saveKey('orsKey','heigit_ors_api_key','HeiGIT API key');

const savedY = localStorage.getItem('yandex_js_api_key');
const savedO = localStorage.getItem('heigit_ors_api_key');
if (savedY) $('yandexKey').value = savedY;
if (savedO) $('orsKey').value = savedO;

function loadYandexApi(key) {
  return new Promise((resolve,reject) => {
    if (apiReady && window.ymaps) return resolve();
    const old = document.getElementById('yandex-api');
    if (old) old.remove();
    const s = document.createElement('script');
    s.id = 'yandex-api';
    s.src = 'https://api-maps.yandex.ru/2.1/?apikey=' + encodeURIComponent(key) + '&lang=ru_RU';
    s.onload = () => ymaps.ready(() => { apiReady = true; resolve(); });
    s.onerror = () => reject(new Error('Не удалось загрузить Yandex JavaScript API'));
    document.head.appendChild(s);
  });
}

async function ensureMap() {
  if (map) return;
  map = new ymaps.Map('map', {
    center:[55.7558,37.6176], zoom:11,
    controls:['zoomControl','geolocationControl','fullscreenControl']
  });
}

function parseCoord(text) {
  const m = text.match(/^\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*$/);
  if (!m) return null;
  return [Number(m[2]), Number(m[1])]; // ORS: [lon,lat]
}

async function geocodeOne(text, key) {
  const direct = parseCoord(text);
  if (direct) return direct;

  const url = new URL('https://api.heigit.org/pelias/v1/search');
  url.searchParams.set('api_key', key);
  url.searchParams.set('text', text);
  url.searchParams.set('size', '1');
  url.searchParams.set('boundary.country', 'RU');

  const r = await fetch(url.toString(), {headers:{'Accept':'application/json'}});
  if (!r.ok) throw new Error('Геокодирование: HTTP ' + r.status + ' для «' + text + '»');
  const j = await r.json();
  const f = j.features && j.features[0];
  if (!f || !f.geometry || !f.geometry.coordinates) throw new Error('Не найден адрес: «' + text + '»');
  return f.geometry.coordinates; // [lon,lat]
}

async function routeGeoJSON(coords, profile, key) {
  const url = 'https://api.heigit.org/openrouteservice/v2/directions/' + profile + '/geojson';
  const r = await fetch(url, {
    method:'POST',
    headers:{
      'Authorization': key,
      'Content-Type':'application/json',
      'Accept':'application/geo+json, application/json'
    },
    body: JSON.stringify({
      coordinates: coords,
      instructions: false,
      elevation: false
    })
  });
  const body = await r.text();
  if (!r.ok) {
    let detail = body;
    try { const j = JSON.parse(body); detail = j.error?.message || j.message || body; } catch(e) {}
    throw new Error('Маршрутизация: HTTP ' + r.status + '. ' + detail);
  }
  return JSON.parse(body);
}

function drawRoute(route, waypointCoords) {
  if (routeLine) map.geoObjects.remove(routeLine);
  if (pointCollection) map.geoObjects.remove(pointCollection);

  const geom = route.features?.[0]?.geometry;
  if (!geom || geom.type !== 'LineString') throw new Error('Маршрутизатор не вернул линию маршрута');

  const ycoords = geom.coordinates.map(([lon,lat]) => [lat,lon]);
  routeLine = new ymaps.Polyline(ycoords, {}, {strokeWidth:5, strokeOpacity:0.85});
  map.geoObjects.add(routeLine);

  pointCollection = new ymaps.GeoObjectCollection();
  waypointCoords.forEach(([lon,lat], i) => {
    pointCollection.add(new ymaps.Placemark([lat,lon], {
      iconContent: String(i+1),
      balloonContent: getPoints()[i] || ('Точка ' + (i+1))
    }, {preset:'islands#blueStretchyIcon'}));
  });
  map.geoObjects.add(pointCollection);

  map.setBounds(routeLine.geometry.getBounds(), {checkZoomRange:true, zoomMargin:30});

  const summary = route.features?.[0]?.properties?.summary;
  if (summary) {
    const km = (summary.distance/1000).toFixed(1);
    const min = Math.round(summary.duration/60);
    status('Маршрут построен. Длина: ' + km + ' км. Расчётное время: ' + min + ' мин. Точек: ' + waypointCoords.length + '.');
  } else {
    status('Маршрут построен. Точек: ' + waypointCoords.length + '.');
  }
}

async function buildRoute() {
  const yKey = $('yandexKey').value.trim() || localStorage.getItem('yandex_js_api_key') || '';
  const oKey = $('orsKey').value.trim() || localStorage.getItem('heigit_ors_api_key') || '';
  if (!yKey) return status('Нет ключа Yandex JavaScript API.');
  if (!oKey) return status('Нет ключа HeiGIT/openrouteservice.');
  const points = getPoints();
  if (points.length < 2) return status('Нужно минимум две точки.');

  try {
    status('1/3 Загружаю Яндекс Карту…');
    await loadYandexApi(yKey);
    await ensureMap();

    status('2/3 Определяю координаты ' + points.length + ' точек…');
    const coords = [];
    for (let i=0; i<points.length; i++) {
      status('2/3 Геокодирование: ' + (i+1) + ' из ' + points.length + '\n' + points[i]);
      coords.push(await geocodeOne(points[i], oKey));
    }

    status('3/3 Строю ' + ($('mode').value === 'foot-walking' ? 'пешеходный' : 'велосипедный') + ' маршрут…');
    const route = await routeGeoJSON(coords, $('mode').value, oKey);
    drawRoute(route, coords);
  } catch(e) {
    status('ОШИБКА:\n' + e.message);
  }
}

$('buildBtn').onclick = buildRoute;
</script>
</body>
</html>
